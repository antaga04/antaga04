<!-- bio paragraph -->
<text x="28" y="96"  class="base">Hello! I'm Adrian, a dedicated <tspan class="key">Software Engineer</tspan> with a passion for</text>
<text x="28" y="126" class="base">crafting visually appealing websites that resonate with users. I</text>
<text x="28" y="156" class="base">enjoy <tspan class="value">front-end</tspan> development the most, but I quite like <tspan class="value">backend</tspan> as</text>
<text x="28" y="186" class="base">well, because I love creating complete apps that help people.</text>

